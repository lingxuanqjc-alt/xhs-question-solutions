name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned optional renderers
        run: npm ci --prefix .agents/skills/xhs-question-solutions --ignore-scripts --no-audit --no-fund

      - name: Run standard-library tests
        run: python -X utf8 -m unittest discover -s tests -v

      - name: Install and verify on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          install_root="$(mktemp -d)"
          trap 'rm -rf "$install_root"' EXIT
          sh installers/install.sh --root "$install_root"
          test -f "$install_root/.agents/skills/xhs-question-solutions/SKILL.md"
          test -f "$install_root/.agents/skills/xhs-question-solutions/assets/card-deck.css"
          test -f "$install_root/.agents/skills/xhs-question-solutions/scripts/render_card_images.py"
          test -f "$install_root/.agents/skills/xhs-question-solutions/scripts/capture_cards.cjs"
          test -f "$install_root/.agents/skills/xhs-question-solutions/scripts/check_publish_profile.py"
          test -f "$install_root/.agents/skills/xhs-question-solutions/scripts/import_voiceover.py"
          test -f "$install_root/.agents/skills/xhs-question-solutions/scripts/render_video.py"
          test -f "$install_root/.agents/skills/xhs-question-solutions/scripts/render_video.mjs"
          test -f "$install_root/.agents/skills/xhs-question-solutions/package.json"
          test -f "$install_root/.agents/skills/xhs-question-solutions/package-lock.json"
          source_core=".agents/skills/xhs-question-solutions"
          installed_core="$install_root/.agents/skills/xhs-question-solutions"
          test -d "$source_core/node_modules"
          test ! -e "$installed_core/node_modules"
          python -X utf8 "$installed_core/scripts/render_video.py" --help | grep -F -- '--project-dir'
          diff -u \
            <(cd "$source_core" && find remotion -type f -print | sort) \
            <(cd "$installed_core" && find remotion -type f -print | sort)
          wrapper="$install_root/.claude/skills/xhs-question-solutions/SKILL.md"
          test -f "$wrapper"
          grep -F '../../../.agents/skills/xhs-question-solutions/SKILL.md' "$wrapper"
          test ! -d "$install_root/.claude/skills/xhs-question-solutions/scripts"

      - name: Install and verify on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP ("xhs-question-solutions-" + [Guid]::NewGuid().ToString("N"))
          ./installers/install.ps1 -DestinationRoot $installRoot
          $core = Join-Path $installRoot ".agents/skills/xhs-question-solutions/SKILL.md"
          $wrapper = Join-Path $installRoot ".claude/skills/xhs-question-solutions/SKILL.md"
          if (-not (Test-Path -LiteralPath $core -PathType Leaf)) {
            throw "Core skill was not installed at $core"
          }
          $requiredCoreFiles = @(
            "assets/card-deck.css",
            "scripts/render_card_images.py",
            "scripts/capture_cards.cjs",
            "scripts/check_publish_profile.py",
            "scripts/import_voiceover.py",
            "scripts/render_video.py",
            "scripts/render_video.mjs",
            "package.json",
            "package-lock.json"
          )
          $coreRoot = Split-Path -Parent $core
          foreach ($relativePath in $requiredCoreFiles) {
            $installedFile = Join-Path $coreRoot $relativePath
            if (-not (Test-Path -LiteralPath $installedFile -PathType Leaf)) {
              throw "Installed skill is missing $installedFile"
            }
          }
          $sourceCoreRoot = ".agents/skills/xhs-question-solutions"
          if (-not (Test-Path -LiteralPath (Join-Path $sourceCoreRoot "node_modules") -PathType Container)) {
            throw "npm ci did not create the source node_modules intent-test fixture."
          }
          if (Test-Path -LiteralPath (Join-Path $coreRoot "node_modules")) {
            throw "Installer copied local node_modules into the installed skill."
          }
          $renderHelp = & python -X utf8 (Join-Path $coreRoot "scripts/render_video.py") --help 2>&1 | Out-String
          if (-not $renderHelp.Contains("--project-dir")) {
            throw "Installed renderer does not expose the v2 project loader."
          }
          $sourceRemotionRoot = Join-Path $sourceCoreRoot "remotion"
          $installedRemotionRoot = Join-Path $coreRoot "remotion"
          $sourceRemotionFiles = @(Get-ChildItem -LiteralPath $sourceRemotionRoot -Recurse -File | ForEach-Object {
            [IO.Path]::GetRelativePath($sourceRemotionRoot, $_.FullName)
          } | Sort-Object)
          $installedRemotionFiles = @(Get-ChildItem -LiteralPath $installedRemotionRoot -Recurse -File | ForEach-Object {
            [IO.Path]::GetRelativePath($installedRemotionRoot, $_.FullName)
          } | Sort-Object)
          if (Compare-Object -ReferenceObject $sourceRemotionFiles -DifferenceObject $installedRemotionFiles) {
            throw "Installed Remotion source tree does not match the repository payload."
          }
          if (-not (Test-Path -LiteralPath $wrapper -PathType Leaf)) {
            throw "Claude wrapper was not installed at $wrapper"
          }
          if (-not (Select-String -LiteralPath $wrapper -SimpleMatch '../../../.agents/skills/xhs-question-solutions/SKILL.md' -Quiet)) {
            throw "Claude wrapper does not reference the installed .agents core."
          }
          $duplicatedScripts = Join-Path $installRoot ".claude/skills/xhs-question-solutions/scripts"
          if (Test-Path -LiteralPath $duplicatedScripts) {
            throw "Claude installation duplicated the core skill scripts."
          }

      - name: Render and verify real PNG cards
        run: |
          python -X utf8 .agents/skills/xhs-question-solutions/scripts/normalize_xhs_export.py examples/sample-input.json build/ci/sample.jsonl
          python -X utf8 .agents/skills/xhs-question-solutions/scripts/render_card_images.py build/ci/sample.jsonl examples/sample-analysis.json build/ci/cards --style morandi --png
          python -X utf8 -c "from pathlib import Path; files=list(Path('build/ci/cards').rglob('*.png')); assert len(files)==13, len(files)"

      - name: Exercise reviewed voiceover init and build CLI
        run: |
          python -X utf8 .agents/skills/xhs-question-solutions/scripts/render_video.py build/ci/sample.jsonl examples/sample-analysis.json build/ci/v1
          python -X utf8 .agents/skills/xhs-question-solutions/scripts/import_voiceover.py init build/ci/v1/video-projects.json build/ci/voiceover/manifest.json
          python -X utf8 tests/prepare_ci_voiceover.py build/ci/voiceover/manifest.json
          python -X utf8 .agents/skills/xhs-question-solutions/scripts/import_voiceover.py build build/ci/v1/video-projects.json build/ci/voiceover/manifest.json build/ci/v2 --confirm-audio-reviewed --confirm-audio-rights
          python -X utf8 -c "import json; from pathlib import Path; project=json.loads(Path('build/ci/v2/video-projects.json').read_text(encoding='utf-8')); assert project['schema']=='xhs-video/v2'; assert project['videos'][0]['meta']['audio']['origin']=='synthetic_ai'; assert list(Path('build/ci/v2/assets/voiceover').glob('*.wav'))"

      - name: Render and ffprobe silent and voiced three-frame compositions on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          test -x "$browser"
          v1_props=(build/ci/v1/*.props.json)
          test "${#v1_props[@]}" -eq 1
          node .agents/skills/xhs-question-solutions/scripts/render_video.mjs \
            --props "${v1_props[0]}" \
            --output build/ci/v1/v1-composition-smoke.mp4 \
            --browser "$browser" \
            --frame-range 0:2 \
            > build/ci/v1/v1-composition-smoke.json
          python -X utf8 -c "import json; from pathlib import Path; video=Path('build/ci/v1/v1-composition-smoke.mp4'); data=video.read_bytes(); summary=json.loads(Path('build/ci/v1/v1-composition-smoke.json').read_text(encoding='utf-8')); probe=summary['probe']; assert len(data)>16 and b'ftyp' in data[:64]; assert summary['codec']=='h264' and summary['rendered_frame_range']==[0,2] and summary['file_size']==len(data); assert probe['codec']=='h264' and (probe['width'],probe['height'],probe['audio_streams'])==(1080,1920,0)"
          v2_props=(build/ci/v2/*.props.json)
          test "${#v2_props[@]}" -eq 1
          node .agents/skills/xhs-question-solutions/scripts/render_video.mjs \
            --props "${v2_props[0]}" \
            --output build/ci/v2/v2-composition-smoke.mp4 \
            --browser "$browser" \
            --frame-range 0:2 \
            > build/ci/v2/v2-composition-smoke.json
          python -X utf8 -c "import json; from pathlib import Path; video=Path('build/ci/v2/v2-composition-smoke.mp4'); data=video.read_bytes(); summary=json.loads(Path('build/ci/v2/v2-composition-smoke.json').read_text(encoding='utf-8')); probe=summary['probe']; assert len(data)>16 and b'ftyp' in data[:64]; assert summary['codec']=='h264' and summary['rendered_frame_range']==[0,2] and summary['file_size']==len(data); assert probe['codec']=='h264' and probe['audio_streams']==1 and probe['audio_codec']=='aac' and probe['audio_sample_rate']==48000 and probe['audio_channels']==1"
          python -X utf8 -c "import json; from pathlib import Path; source=Path('${v1_props[0]}'); data=json.loads(source.read_text(encoding='utf-8')); scene=data['video']['scenes'][0]; scene['narration']='W'*40; scene['captions']=[{'text':'W'*40,'startMs':200,'endMs':2700,'timestampMs':None,'confidence':None}]; Path('build/ci/v1/overflow.props.json').write_text(json.dumps(data,ensure_ascii=False),encoding='utf-8')"
          if node .agents/skills/xhs-question-solutions/scripts/render_video.mjs \
            --props build/ci/v1/overflow.props.json \
            --output build/ci/v1/overflow.mp4 \
            --browser "$browser" \
            --frame-range 0:2 \
            > build/ci/v1/overflow.stdout 2> build/ci/v1/overflow.stderr; then
            echo "Expected caption overflow render to fail" >&2
            exit 1
          fi
          grep -F 'CAPTION_OVERFLOW' build/ci/v1/overflow.stderr
          test ! -e build/ci/v1/overflow.mp4
